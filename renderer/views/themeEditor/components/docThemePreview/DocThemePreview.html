<div class="theme-editor_preview-container">
    <div id="{{id:tab-container_project-select}}" class="theme-editor_preview-header">
        <button id="{{id:tab-element_showcase}}" class="tab-element" data-tab-action="showcase" data-shortcut-label="ThemeEditor:previewShowcase" data-shortcut-context="themeEditor" data-shortcut-target="title" data-shortcut-title="{{t:themeEditor.preview.showcase}}">{{t:themeEditor.preview.showcase}}</button>
        <button id="{{id:tab-element_project}}" class="tab-element" data-tab-action="openProject" data-shortcut-label="ThemeEditor:previewProject" data-shortcut-context="themeEditor" data-shortcut-target="title" data-shortcut-title="{{t:themeEditor.preview.project}}">{{t:themeEditor.preview.project}}</button>
    </div>
    <iframe id="{{id:preview-container}}" class="theme-editor_preview">
    </iframe>
</div>
