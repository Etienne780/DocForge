<div class="theme-editor_sidebarLeft">
    <div id="{{id:tab-element_container}}" class="theme-editor_sidebarLeft-header">
        <button id="{{id:tab-element_appearance}}" class="tab-element" data-tab-action="appearance" data-shortcut-label="ThemeEditor:tabAppearance" data-shortcut-context="themeEditor" data-shortcut-target="title" data-shortcut-title="{{t:themeEditor.tabs.appearance}}">{{t:themeEditor.tabs.appearance}}</button>
        <button id="{{id:tab-element_layout}}" class="tab-element" data-tab-action="layout" data-shortcut-label="ThemeEditor:tabLayout" data-shortcut-context="themeEditor" data-shortcut-target="title" data-shortcut-title="{{t:themeEditor.tabs.layout}}">{{t:themeEditor.tabs.layout}}</button>
        <button id="{{id:tab-element_spacing}}" class="tab-element" data-tab-action="spacing" data-shortcut-label="ThemeEditor:tabSpacing" data-shortcut-context="themeEditor" data-shortcut-target="title" data-shortcut-title="{{t:themeEditor.tabs.spacing}}">{{t:themeEditor.tabs.spacing}}</button>
        <button id="{{id:tab-element_mapping}}" class="tab-element" data-tab-action="mapping" data-shortcut-label="ThemeEditor:tabMapping" data-shortcut-context="themeEditor" data-shortcut-target="title" data-shortcut-title="{{t:themeEditor.tabs.mapping}}">{{t:themeEditor.tabs.mapping}}</button>
    </div>
    <div class="theme-editor_sidebarLeft-content">
        <!-- Appearance -->
        <div id="{{id:content-appearance}}" class="theme-editor_sidebarLeft-content-slot hidden" data-tab="appearance"></div>
        <!-- Layout -->
        <div id="{{id:content-layout}}" class="theme-editor_sidebarLeft-content-slot hidden" data-tab="layout"></div>
        <!-- Spacing -->
        <div id="{{id:content-spacing}}" class="theme-editor_sidebarLeft-content-slot hidden" data-tab="spacing"></div>
        <!-- Mappings -->
        <div id="{{id:content-mapping}}" class="theme-editor_sidebarLeft-content-slot hidden" data-tab="mapping"></div>
    </div>
    <div class="theme-editor_sidebarLeft-footer">
        <button id="{{id:theme-editor_reset-button}}" class="button button--danger">{{t:themeEditor.reset}}</button>
    </div>
</div>
