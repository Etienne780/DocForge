<aside id="{{id:sidebar}}" class="doc_editor-sidebar_left">

  <div class="doc_editor-sidebar-left__header">
    <span>{{t:sidebar.tab}}</span>
    <select id="{{id:tab-selector}}" class="tab-selector" aria-label="{{t:sidebar.selectTab}}"></select>
    <button id="{{id:tab-manager-button}}" class="icon-button icon-button--small" title="{{t:sidebar.tabManagerTitle}}" aria-label="{{t:sidebar.openTabManager}}">☰</button>  
  </div>
  
  <div class="search-wrapper">
    <span class="search-wrapper__icon" aria-hidden="true">⌕</span>
    <input
      id="{{id:search-input}}"
      type="text"
      class="search-input"
      placeholder="{{t:sidebar.search}}"
      autocomplete="off"
      aria-label="{{t:sidebar.searchLabel}}"
    >
  </div>

  <div class="doc_editor-sidebar_left-toolbar">
    <div class="doc_editor-sidebar_left-toolbar__actions">
      <button id="{{id:toolbar-add}}" class="icon-button icon-button--small" title="{{t:sidebar.addEntry}}" data-shortcut-label="Entry:new" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:sidebar.addEntry}}"></button>
      <button id="{{id:toolbar-expand}}" class="icon-button icon-button--small" title="{{t:sidebar.expandAll}}"></button>
      <button id="{{id:toolbar-collapse}}" class="icon-button icon-button--small" title="{{t:sidebar.collapseAll}}"></button>
    </div>
  </div>

  <div id="{{id:tree-container}}" class="project-manager-tree-container" role="tree" aria-label="{{t:sidebar.treeLabel}}"></div>

</aside>
