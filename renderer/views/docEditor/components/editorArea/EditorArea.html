<div id="{{id:editor-area}}" class="editor-area">

  <div id="{{id:toolbar}}" class="editor-toolbar">

    <div class="toolbar-container-left">
      <button class="toolbar-button" data-toolbar-action="h1" title="Heading 1" data-shortcut-label="Format:h1" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="Heading 1">H1</button>
      <button class="toolbar-button" data-toolbar-action="h2" title="Heading 2" data-shortcut-label="Format:h2" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="Heading 2">H2</button>
      <button class="toolbar-button" data-toolbar-action="h3" title="Heading 3" data-shortcut-label="Format:h3" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="Heading 3">H3</button>

      <div class="horizontal-separator"></div>

      <button class="toolbar-button" data-toolbar-action="bold" title="Bold" data-shortcut-label="Format:bold" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="Bold"><b>B</b></button>
      <button class="toolbar-button" data-toolbar-action="italic" title="Italic" data-shortcut-label="Format:italic" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="Italic"><em>I</em></button>
      <button class="toolbar-button" data-toolbar-action="inline-code" title="Inline code" data-shortcut-label="Format:inline-code" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="Inline code">` `</button>

      <div class="horizontal-separator"></div>

      <button class="toolbar-button" data-toolbar-action="unordered-list" title="Unordered list" data-shortcut-label="Format:unordered-list" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="Unordered list">- L</button>
      <button class="toolbar-button" data-toolbar-action="ordered-list" title="Ordered list" data-shortcut-label="Format:ordered-list" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="Ordered list">1. L</button>
      <button class="toolbar-button" data-toolbar-action="blockquote" title="Blockquote" data-shortcut-label="Format:blockquote" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="Blockquote">❝</button>
      <button class="toolbar-button" data-toolbar-action="code-block" title="Code block" data-shortcut-label="Format:code-block" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="Code block">{ }</button>
      <button class="toolbar-button" data-toolbar-action="link" title="Insert link" data-shortcut-label="Format:link" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="Insert link">⛓</button>
      <button class="toolbar-button" data-toolbar-action="ref-anchor" title="Link here (anchor + reference link)">{#}</button>
      <button class="toolbar-button" data-toolbar-action="hr" title="Horizontal rule">-</button>
      <button class="toolbar-button" data-toolbar-action="table" title="Insert table">⊞</button>
    </div>

    <div class="toolbar-container-right">
      <div class="editor-mode-toggle">
        <button class="editor-mode-button editor-mode-button--active" id="{{id:mode-split}}" data-mode="split" title="Split view">⫾</button>
        <button class="editor-mode-button" id="{{id:mode-editor}}" data-mode="editor" title="Editor only">✎</button>
        <button class="editor-mode-button" id="{{id:mode-preview}}" data-mode="preview" title="Preview only">◉</button>
      </div>

      <div class="editor-mode-toggle">
        <button class="editor-mode-button" id="{{id:word-wrap-btn}}" title="Word wrap" aria-label="Word wrap"></button>
      </div>
    </div>

  </div>

  <div id="{{id:content-notice}}" class="editor-content-notice hidden"></div>

  <div id="{{id:split-pane}}" class="split-pane">
    
    <div id="{{id:editor-input-wrapper}}" class="editor-input-wrapper-base editor-input-wrapper">
      <textarea
        id="{{id:editor-input}}"
        class="editor-input"
        placeholder="Enter Markdown here…&#10;&#10;# Heading&#10;## Section&#10;**bold** *italic* `code`"
        spellcheck="false"
      ></textarea>
    </div>


    <iframe id="{{id:preview-pane}}" class="editor-area-preview-pane" data-preview-panel></iframe>

  </div>

</div>
