<div id="{{id:editor-area}}" class="editor-area">

  <div id="{{id:toolbar}}" class="editor-toolbar">

    <div class="toolbar-container-left">
      <button class="toolbar-button" data-toolbar-action="h1" title="{{t:editor.toolbar.h1}}" data-shortcut-label="Format:h1" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.h1}}">H1</button>
      <button class="toolbar-button" data-toolbar-action="h2" title="{{t:editor.toolbar.h2}}" data-shortcut-label="Format:h2" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.h2}}">H2</button>
      <button class="toolbar-button" data-toolbar-action="h3" title="{{t:editor.toolbar.h3}}" data-shortcut-label="Format:h3" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.h3}}">H3</button>

      <div class="horizontal-separator"></div>

      <button class="toolbar-button" data-toolbar-action="bold" title="{{t:editor.toolbar.bold}}" data-shortcut-label="Format:bold" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.bold}}"><b>B</b></button>
      <button class="toolbar-button" data-toolbar-action="italic" title="{{t:editor.toolbar.italic}}" data-shortcut-label="Format:italic" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.italic}}"><em>I</em></button>
      <button class="toolbar-button" data-toolbar-action="inline-code" title="{{t:editor.toolbar.inline-code}}" data-shortcut-label="Format:inline-code" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.inline-code}}">` `</button>

      <div class="horizontal-separator"></div>

      <button class="toolbar-button" data-toolbar-action="unordered-list" title="{{t:editor.toolbar.unordered-list}}" data-shortcut-label="Format:unordered-list" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.unordered-list}}">- L</button>
      <button class="toolbar-button" data-toolbar-action="ordered-list" title="{{t:editor.toolbar.ordered-list}}" data-shortcut-label="Format:ordered-list" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.ordered-list}}">1. L</button>
      <button class="toolbar-button" data-toolbar-action="check-mark" title="{{t:editor.toolbar.check-mark}}" data-shortcut-label="Format:check-mark" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.check-mark}}">[x]</button>
      <button class="toolbar-button" data-toolbar-action="blockquote" title="{{t:editor.toolbar.blockquote}}" data-shortcut-label="Format:blockquote" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.blockquote}}">❝</button>
      <button class="toolbar-button" data-toolbar-action="code-block" title="{{t:editor.toolbar.code-block}}" data-shortcut-label="Format:code-block" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.code-block}}">{ }</button>
      <button class="toolbar-button" data-toolbar-action="link" title="{{t:editor.toolbar.link}}" data-shortcut-label="Format:link" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.toolbar.link}}">⛓</button>
      <button class="toolbar-button" data-toolbar-action="ref-anchor" title="{{t:editor.toolbar.ref-anchor}}">{#}</button>
      <button class="toolbar-button" data-toolbar-action="hr" title="{{t:editor.toolbar.hr}}">-</button>
      <button class="toolbar-button" data-toolbar-action="table" title="{{t:editor.toolbar.table}}">⊞</button>
      <button class="toolbar-button" data-toolbar-action="tree" title="{{t:editor.toolbar.tree}}">├─</button>
      <button class="toolbar-button" data-toolbar-action="section" title="{{t:editor.toolbar.section}}">▸≡</button>
      <button class="toolbar-button" data-toolbar-action="footnote" title="{{t:editor.toolbar.footnote}}">[^]</button>
    </div>

    <div class="toolbar-container-right">
      <div class="editor-mode-toggle">
        <!-- the shortcuts have no key by default, the tooltip shows one once it is set -->
        <button class="editor-mode-button editor-mode-button--active" id="{{id:mode-split}}" data-mode="split" title="{{t:editor.modes.split}}" data-shortcut-label="View:split" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.modes.split}}">⫾</button>
        <button class="editor-mode-button" id="{{id:mode-editor}}" data-mode="editor" title="{{t:editor.modes.editor}}" data-shortcut-label="View:editor" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.modes.editor}}">✎</button>
        <button class="editor-mode-button" id="{{id:mode-preview}}" data-mode="preview" title="{{t:editor.modes.preview}}" data-shortcut-label="View:preview" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.modes.preview}}">◉</button>
      </div>

      <div class="editor-mode-toggle">
        <button class="editor-mode-button" id="{{id:word-wrap-btn}}" title="{{t:editor.wordWrap}}" aria-label="{{t:editor.wordWrap}}" data-shortcut-label="Editor:wordWrapToggle" data-shortcut-context="docEditor" data-shortcut-target="title" data-shortcut-title="{{t:editor.wordWrap}}"></button>
      </div>
    </div>

  </div>

  <div id="{{id:content-notice}}" class="editor-content-notice hidden"></div>

  <div id="{{id:split-pane}}" class="split-pane">
    
    <div id="{{id:editor-input-wrapper}}" class="editor-input-wrapper-base editor-input-wrapper">
      <div id="{{id:editor-input-container}}" class="editor-input-container">
        <textarea
          id="{{id:editor-input}}"
          class="editor-input"
          placeholder="{{t:editor.placeholder}}"
          spellcheck="false"
        ></textarea>
      </div>
    </div>


    <iframe id="{{id:preview-pane}}" class="editor-area-preview-pane" data-preview-panel></iframe>

    <!-- find / replace box: top right of the whole pane, so a narrow editor doesn't clip it -->
    <div id="{{id:find-slot}}" class="editor-find-slot"></div>

  </div>

</div>
