<div class="preferences">

    <nav id="preferences_nav" class="preferences__nav" aria-label="Preference sections"></nav>

    <div class="preferences__main">
        <div class="preferences__header">
            <button id="preferences_back" class="button button--secondary" type="button" title="Back to the previous view">← Back</button>
            <input id="preferences_search"
                class="form-input preferences__search"
                type="text"
                placeholder="Search settings"
                autocomplete="off"
                spellcheck="false"
                aria-label="Search settings">
        </div>

        <div id="preferences_content" class="preferences__content"></div>
    </div>

</div>
