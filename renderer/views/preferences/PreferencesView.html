<div class="preferences">

    <nav id="preferences_nav" class="preferences__nav" aria-label="{{t:preferences.navLabel}}"></nav>

    <div class="preferences__main">
        <div class="preferences__header">
            <button id="preferences_back" class="button button--secondary" type="button" title="{{t:preferences.backTitle}}">{{t:preferences.back}}</button>
            <input id="preferences_search"
                class="form-input preferences__search"
                type="text"
                placeholder="{{t:preferences.search}}"
                autocomplete="off"
                spellcheck="false"
                aria-label="{{t:preferences.search}}">
        </div>

        <div id="preferences_content" class="preferences__content"></div>
    </div>

</div>
